name: Signed release smoke test
on:
  workflow_dispatch:
    inputs:
      release_run_id:
        description: Successful Android build run containing LiveMuse-release
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  release-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Download signed APK
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_RUN_ID: ${{ inputs.release_run_id }}
        run: |
          [[ "$RELEASE_RUN_ID" =~ ^[0-9]+$ ]]
          gh run download "$RELEASE_RUN_ID" --name LiveMuse-release --dir output/signed-release
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch signed and minified APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_2
          script: python3 tools/release_smoke.py output/signed-release/apk/release/app-release.apk
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: signed-release-smoke-report
          path: output/release-smoke/
