name: Android device tests
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  device:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6.4.0
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_2
          script: chmod +x gradlew tools/capture_store.sh && ./gradlew installDebug installDebugAndroidTest && tools/capture_store.sh
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: device-test-reports
          path: |
            store/screenshots/
            output/device-tests/
